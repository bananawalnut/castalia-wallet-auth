name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contract and distribution checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test old and new contracts
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build distribution
        run: npm run build
      - name: Verify tracked distribution and lockfile
        run: |
          git diff --exit-code -- dist package-lock.json
          test -z "$(git ls-files --others --exclude-standard -- dist)"
